<!doctype html>
<html><head><meta charset="utf-8"><title>Aspiron Play Store art</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#111;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
:root{--gold1:#f0dca4;--gold2:#c9a259;--gold3:#8f6d2c;--ink:#111215;--ink2:#2b2d32;--ivory:#f8f6f1}
.slide{position:relative;width:1080px;height:1920px;overflow:hidden}
.fg{position:relative;width:1024px;height:500px;overflow:hidden}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.dots{position:absolute;inset:0;background-image:radial-gradient(currentColor 1.6px,transparent 1.8px);background-size:44px 44px;opacity:.08;mask-image:linear-gradient(#000,transparent 55%);-webkit-mask-image:linear-gradient(#000,transparent 55%)}
.copy{position:absolute;left:90px;right:90px;top:120px}
.kick{display:inline-flex;align-items:center;gap:14px;font-weight:700;font-size:27px;letter-spacing:.2em;text-transform:uppercase}
.kick i{display:block;width:54px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--gold3),var(--gold1))}
h1{font-family:'Inter Display','Inter',sans-serif;font-weight:800;font-size:92px;line-height:1.03;letter-spacing:-.035em;margin-top:30px}
h1 em{font-style:normal;background:linear-gradient(100deg,var(--gold1),var(--gold2) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:38px;line-height:1.35;font-weight:500;margin-top:30px;max-width:820px}
.dark .kick,.t-ink .kick,.t-night .kick{color:var(--gold1)}
.t-ink{background:linear-gradient(165deg,#2b2d32 0%,#15161a 55%,#0b0b0d 100%);color:#fff;--c:#fff}
.t-night{background:linear-gradient(165deg,#16263d 0%,#0d1726 55%,#070d17 100%);color:#fff}
.t-ivory{background:linear-gradient(170deg,#fbf9f4 0%,#f1ece0 100%);color:#17181b}
.t-ivory .kick{color:#85672c}
.t-ivory h1 em{background:linear-gradient(100deg,#b08945,#85672c 60%,#5e4414);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-champ{background:linear-gradient(160deg,#f6e9c6 0%,#e4c98a 55%,#c9a259 100%);color:#17140b}
.t-champ .kick{color:#6b4f17}
.t-ink .sub,.t-night .sub{color:rgba(255,255,255,.72)}
.t-ivory .sub{color:#5e6066}
.t-champ .sub{color:rgba(23,20,11,.74)}
.t-champ h1 em{background:linear-gradient(100deg,#6b4f17,#17140b);-webkit-background-clip:text;background-clip:text;color:transparent}

/* phone */
.phone{position:absolute;width:400px;height:860px;border-radius:66px;padding:12px;transform-origin:50% 50%;
 background:linear-gradient(145deg,#4a4c52,#16171a 30%,#0a0a0c 70%,#3a3c42);
 box-shadow:0 0 0 2px #0a0a0c,0 2px 0 3px #5b5d63 inset,0 70px 120px -20px rgba(0,0,0,.6),0 30px 50px -20px rgba(0,0,0,.5)}
.phone:before{content:"";position:absolute;right:-5px;top:190px;width:5px;height:90px;border-radius:3px;background:#2a2b2f}
.phone:after{content:"";position:absolute;left:-5px;top:150px;width:5px;height:56px;border-radius:3px;background:#2a2b2f;box-shadow:0 80px 0 #2a2b2f}
.scr{position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;background:var(--bg);color:var(--tx)}
.isl{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:20px;background:#050506;z-index:20}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0;font-size:15px;font-weight:700;z-index:15;color:var(--tx)}
.sb span:last-child{display:flex;gap:6px;align-items:center}
/* app tokens */
.app{--bg:#f5f5f3;--surf:#fff;--surf2:#efeeea;--tx:#17181b;--mut:#6a6c72;--line:#e6e5e0;--acc:#85672c;--accS:#f6eedb;--ok:#2d7a58;--okS:#dff1e7;--err:#b3433d;--errS:#f7e1df;--info:#3f72b8}
.app.dk{--bg:#0e0f12;--surf:#1a1b20;--surf2:#24262b;--tx:#f3f2ee;--mut:#9a9ca3;--line:#2b2d33;--acc:#e6cf9a;--accS:#2b2518;--ok:#58c08f;--okS:#17301f;--err:#e5736b;--errS:#35191a;--info:#7aa7e6}
.pad{padding:62px 18px 0}
.row{display:flex;align-items:center}
.gold{background:linear-gradient(135deg,var(--gold1),var(--gold2) 60%,var(--gold3));color:#1d1608}
.card{background:var(--surf);border:1px solid var(--line);border-radius:20px}
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--surf);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:12px 8px 0}
.nav div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--mut);width:64px}
.nav div.on{color:var(--acc)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.logo{width:40px;height:40px;border-radius:12px}
.h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.mut{color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
/* floating glass chips */
.chip{position:absolute;z-index:30;display:flex;align-items:center;gap:16px;padding:22px 28px;border-radius:30px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
.chip b{display:block;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.chip small{display:block;font-size:22px;font-weight:600;margin-top:6px;opacity:.7}
.chip .bub{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;flex:none}
.chip .bub svg{width:36px;height:36px}
.chip.dkc{background:rgba(24,25,29,.86);backdrop-filter:blur(18px);color:#fff;border:1px solid rgba(255,255,255,.14)}
.chip.ltc{background:rgba(255,255,255,.92);color:#17181b;border:1px solid rgba(0,0,0,.06)}
.chip.dkc .bub{background:linear-gradient(135deg,var(--gold1),var(--gold3));color:#1d1608}
.chip.ltc .bub{background:linear-gradient(135deg,#232428,#0e0e10);color:var(--gold1)}
</style></head><body>
<div id="root"></div>
<script>
const P={
 book:'<path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2V5z"/><path d="M8 7h6"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
 mark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
 gift:'<path d="M3 9h18v4H3zM5 13v8h14v-8M12 9v12"/><path d="M12 9c-3 0-4-4-1.5-4S12 9 12 9zM12 9c3 0 4-4 1.5-4S12 9 12 9z"/>',
 home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
 file:'<path d="M6 3h9l4 4v14H6zM14 3v5h5"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
 trophy:'<path d="M8 4h8v6a4 4 0 0 1-8 0zM8 6H4v2a3 3 0 0 0 4 3M16 6h4v2a3 3 0 0 1-4 3M12 14v4M8 21h8"/>',
 bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/>',
 lang:'<path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 6 8M12 5c-1 4-4 7-8 9M14 21l4-10 4 10M15.2 18h5.6"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>'
};
const ic=(n,s)=>`<svg class="ic" viewBox="0 0 24 24" ${s?`style="${s}"`:''}>${P[n]}</svg>`;
const status=(c)=>`<div class="sb"><span>9:41</span><span><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg></span></div>`;
const nav=(on)=>{const it=[['home','Home'],['file','Tests'],['grid','Tools'],['chart','Stats'],['user','Profile']];return `<div class="nav">${it.map((x,i)=>`<div class="${i==on?'on':''}">${ic(x[0])}${x[1]}</div>`).join('')}</div>`};
const bar=(t,right='')=>`<div class="row" style="justify-content:space-between;margin-bottom:14px"><div class="row" style="gap:10px"><img class="logo" src="logo.png"><div><div style="font-size:11px;color:var(--mut);font-weight:600">${t[0]}</div><div style="font-size:17px;font-weight:800;letter-spacing:-.02em">${t[1]}</div></div></div>${right||`<div class="card" style="width:40px;height:40px;display:grid;place-items:center;border-radius:14px">${ic('bell')}</div>`}</div>`;

/* ---------- screens ---------- */
const S={};
S.home=(dk)=>`<div class="app ${dk?'dk':''} scr">${status()}<div class="pad">
 ${bar(['Good morning','Hello, Aspirant'])}
 <div style="border-radius:26px;padding:20px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,rgba(230,207,154,.38),transparent 55%),linear-gradient(160deg,#2b2d32,#111215);position:relative;overflow:hidden">
  <div class="row" style="gap:8px"><span class="pill" style="background:rgba(255,255,255,.12)"><span style="width:7px;height:7px;border-radius:50%;background:#ff6b5e"></span>LIVE TEST</span><span style="font-size:12px;opacity:.7;font-weight:600">Starts today · 10:00 AM</span></div>
  <div style="font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:14px;line-height:1.15">NEET Full Syllabus<br>Test 12</div>
  <div class="row" style="gap:14px;margin-top:12px;font-size:12.5px;opacity:.75;font-weight:600"><span>180 Questions</span><span>·</span><span>180 min</span><span>·</span><span>720 marks</span></div>
  <div class="gold row" style="margin-top:18px;height:46px;border-radius:15px;justify-content:center;font-weight:800;font-size:15px;gap:8px">Start test ${ic('bolt','width:18px;height:18px')}</div>
 </div>
 <div class="row" style="gap:10px;margin-top:14px">
  ${[['24','Tests taken'],['612','Best score'],['#128','Best rank']].map(x=>`<div class="card" style="flex:1;padding:14px 10px;text-align:center"><div style="font-size:22px;font-weight:800;letter-spacing:-.03em">${x[0]}</div><div style="font-size:11px;color:var(--mut);font-weight:600;margin-top:2px">${x[1]}</div></div>`).join('')}
 </div>
 <div class="h2" style="margin:18px 2px 10px">Practice tools</div>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
  ${[['book','Question Bank'],['clock','PYQ'],['target','Mistakes'],['chart','Tracker'],['mark','Saved'],['gift','Refer & Earn']].map(x=>`<div class="card" style="padding:14px 6px;text-align:center"><div style="width:42px;height:42px;border-radius:14px;margin:0 auto 8px;display:grid;place-items:center;background:var(--accS);color:var(--acc)">${ic(x[0])}</div><div style="font-size:11.5px;font-weight:700">${x[1]}</div></div>`).join('')}
 </div>
 </div>${nav(0)}</div>`;

S.exam=()=>`<div class="app scr"><div style="--tx:#fff;color:#fff;position:relative;z-index:16">${status()}</div>
 <div style="position:absolute;top:0;left:0;right:0;height:128px;background:linear-gradient(160deg,#2b2d32,#111215);color:#fff;padding:62px 18px 0">
  <div class="row" style="justify-content:space-between"><div><div style="font-size:11px;opacity:.6;font-weight:600">NEET Full Syllabus</div><div style="font-size:16px;font-weight:800">Test 12</div></div>
  <div class="row gold" style="gap:7px;padding:8px 13px;border-radius:13px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums">${ic('clock','width:17px;height:17px')}02:14:36</div></div></div>
 <div style="position:absolute;top:128px;left:0;right:0;padding:14px 18px">
  <div class="row" style="gap:8px">${['Physics','Chemistry','Biology'].map((x,i)=>`<div style="flex:1;text-align:center;padding:10px 0;border-radius:13px;font-size:13px;font-weight:700;${i==2?'background:var(--ink);color:#fff;background:#17181b':'background:var(--surf);border:1px solid var(--line);color:var(--mut)'}">${x}</div>`).join('')}</div>
  <div class="row" style="justify-content:space-between;margin:18px 2px 10px"><span style="font-weight:800;font-size:15px">Question 87 <span class="mut" style="font-weight:600">of 180</span></span><span class="row" style="gap:6px"><span class="pill" style="background:var(--okS);color:var(--ok)">+4</span><span class="pill" style="background:var(--errS);color:var(--err)">−1</span></span></div>
  <div class="card" style="padding:18px"><div style="font-size:16.5px;line-height:1.5;font-weight:600;letter-spacing:-.01em">Which cell organelle is the main site of aerobic respiration in a eukaryotic cell?</div></div>
  ${[['A','Ribosome'],['B','Mitochondria'],['C','Golgi apparatus'],['D','Lysosome']].map((x,i)=>`<div class="row" style="gap:12px;margin-top:10px;padding:14px;border-radius:17px;background:${i==1?'var(--accS)':'var(--surf)'};border:1.5px solid ${i==1?'#c9a259':'var(--line)'}"><span style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;${i==1?'background:linear-gradient(135deg,#f0dca4,#b08945);color:#1d1608':'background:var(--surf2);color:var(--mut)'}">${x[0]}</span><span style="font-size:15px;font-weight:${i==1?800:600}">${x[1]}</span>${i==1?`<span style="margin-left:auto;color:var(--acc)">${ic('check')}</span>`:''}</div>`).join('')}
  <div class="row" style="gap:10px;margin-top:16px"><div class="card" style="flex:1;height:46px;display:grid;place-items:center;font-size:13px;font-weight:700;border-radius:15px">Mark for review</div><div style="flex:1;height:46px;border-radius:15px;background:#17181b;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800">Save & Next</div></div>
  <div class="h2" style="margin:18px 2px 10px;font-size:13px">Question palette</div>
  <div style="display:grid;grid-template-columns:repeat(9,1fr);gap:7px">${Array.from({length:27},(_,i)=>{const n=i+79;const st=n<87?(n%4==0?'r':'a'):(n==87?'c':'n');const m={a:'background:#2d7a58;color:#fff',r:'background:#7b5bb8;color:#fff',c:'background:linear-gradient(135deg,#f0dca4,#b08945);color:#1d1608',n:'background:var(--surf);border:1px solid var(--line);color:var(--mut)'}[st];return `<div style="aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;${m}">${n}</div>`}).join('')}</div>
 </div></div>`;

const ring=(pct,size,label,sub,col='#c9a259')=>{const r=size/2-9,c=2*Math.PI*r;return `<div style="position:relative;width:${size}px;height:${size}px"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="12"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#gg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*pct} ${c}"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:${size/4.2}px;font-weight:800;letter-spacing:-.04em">${label}</div><div style="font-size:11px;opacity:.65;font-weight:600">${sub}</div></div></div>`};
S.result=()=>`<div class="app scr">${status()}<div class="pad">
 <svg width="0" height="0"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0dca4"/><stop offset="1" stop-color="#b08945"/></linearGradient></defs></svg>
 ${bar(['NEET Full Syllabus · Test 12','Your Result'],`<div class="pill" style="background:var(--okS);color:var(--ok)">Submitted</div>`)}
 <div style="border-radius:28px;padding:22px 20px;color:#fff;background:radial-gradient(110% 80% at 0% 0%,rgba(230,207,154,.3),transparent 60%),linear-gradient(160deg,#2b2d32,#111215)">
  <div class="row" style="gap:18px">${ring(.85,150,'612','out of 720')}
   <div style="flex:1"><div style="font-size:12px;opacity:.65;font-weight:600">Your rank</div><div style="font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1.05">#128</div><div style="font-size:12px;opacity:.7;font-weight:600;margin-top:2px">of 4,215 students</div>
   <div class="pill gold" style="margin-top:10px">${ic('trophy','width:14px;height:14px')}Top 3%</div></div></div>
 </div>
 <div class="row" style="gap:10px;margin-top:12px">${[['Accuracy','91%'],['Correct','158'],['Time','2h 41m']].map(x=>`<div class="card" style="flex:1;padding:13px 8px;text-align:center"><div style="font-size:19px;font-weight:800;letter-spacing:-.03em">${x[1]}</div><div style="font-size:11px;color:var(--mut);font-weight:600;margin-top:2px">${x[0]}</div></div>`).join('')}</div>
 <div class="card" style="margin-top:12px;padding:16px">
  <div class="h2" style="margin-bottom:12px">Subject-wise score</div>
  ${[['Physics',142,180,'#3f72b8'],['Chemistry',150,180,'#c4692e'],['Biology',320,360,'#1f9a72']].map(x=>`<div style="margin-bottom:13px"><div class="row" style="justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:6px"><span>${x[0]}</span><span class="mut">${x[1]}/${x[2]}</span></div><div style="height:9px;border-radius:9px;background:var(--surf2)"><div style="height:100%;width:${x[1]/x[2]*100}%;border-radius:9px;background:${x[3]}"></div></div></div>`).join('')}
 </div>
 <div class="row" style="gap:10px;margin-top:12px"><div class="gold" style="flex:1;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:13.5px">View solutions</div><div class="card" style="flex:1;height:46px;display:grid;place-items:center;font-weight:800;font-size:13.5px;border-radius:15px">Leaderboard</div></div>
 </div>${nav(1)}</div>`;

S.analysis=()=>{const pts=[412,455,438,502,531,498,566,612];const mx=640,mn=380,W=330,H=120;const xy=pts.map((v,i)=>[i*(W/7)+10,H-((v-mn)/(mx-mn))*H+8]);const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 return `<div class="app scr">${status()}<div class="pad">
 ${bar(['Performance','Analysis'])}
 <div class="card" style="padding:16px"><div class="row" style="justify-content:space-between"><div><div style="font-size:12px;color:var(--mut);font-weight:600">Score trend · last 8 tests</div><div style="font-size:30px;font-weight:800;letter-spacing:-.04em;margin-top:2px">612 <span class="pill" style="background:var(--okS);color:var(--ok);vertical-align:middle">▲ +200</span></div></div></div>
 <svg viewBox="0 0 350 150" style="width:100%;margin-top:6px"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a259" stop-opacity=".35"/><stop offset="1" stop-color="#c9a259" stop-opacity="0"/></linearGradient><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#b08945"/><stop offset="1" stop-color="#e6cf9a"/></linearGradient></defs>
 ${[0,1,2,3].map(i=>`<line x1="0" x2="350" y1="${10+i*38}" y2="${10+i*38}" stroke="var(--line)" stroke-dasharray="3 5"/>`).join('')}
 <path d="${d} L${xy[7][0]} 140 L${xy[0][0]} 140Z" fill="url(#ar)"/><path d="${d}" fill="none" stroke="url(#ln)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 ${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i==7?7:4}" fill="${i==7?'#fff':'#c9a259'}" stroke="#c9a259" stroke-width="${i==7?4:0}"/>`).join('')}</svg></div>
 <div class="row" style="justify-content:space-between;margin:18px 2px 10px"><span class="h2">Chapters to improve</span><span style="font-size:12px;font-weight:700;color:var(--acc)">View all</span></div>
